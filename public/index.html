<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4f6f2">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Sage">
  <title>Sage</title>
  <script>
    try {
      document.documentElement.dataset.text = localStorage.getItem('sage_text') || 'large';
      document.documentElement.dataset.theme = localStorage.getItem('sage_theme') || 'light';
    } catch (e) {}
  </script>
  <link rel="stylesheet" href="/styles.css">
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23e8efe6'/><text y='.9em' x='12' font-size='72'>🌿</text></svg>">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌿</text></svg>">
</head>
<body>
  <div id="app">
    <main id="main" aria-live="polite"></main>
    <nav id="nav" class="hidden">
      <button data-view="now" class="nav-btn active"><span>🌿</span>Now</button>
      <button data-view="today" class="nav-btn"><span>📋</span>Today</button>
      <button id="capture-fab" aria-label="Tell Sage something">Tell<br>Sage</button>
      <button data-view="week" class="nav-btn"><span>🗓️</span>Week</button>
      <button data-view="more" class="nav-btn"><span>⋯</span>More</button>
    </nav>
  </div>
  <div id="modal-root"></div>
  <div id="toast-root"></div>
  <script src="/app.js"></script>
</body>
</html>
